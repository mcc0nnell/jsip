name: JAIN-SIP baseline

on:
  push:
    branches:
      - vrs-interop
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  baseline:
    name: Historical build + TCK baseline
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up JDK 8
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '8'

      - name: Install Ant
        run: |
          sudo apt-get update
          sudo apt-get install -y ant

      - name: Record toolchain
        run: |
          java -version
          javac -version
          ant -version

      - name: Build reference implementation
        run: ant make

      - name: Run JAIN-SIP TCK baseline
        run: ant runtck

      - name: Preserve baseline evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: jain-sip-baseline-evidence
          if-no-files-found: warn
          path: |
            test-reports/
            logs/
            *.jar
            version.txt
            TIMESTAMP
